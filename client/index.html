<!doctype html>
<html class="dark" lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPMS - Internal Project Management System</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#135bec",
            "primary-hover": "#0f47bf",
            "accent": "#2d4263",
            "accent-hover": "#1f2f47",
            "background-light": "#f6f6f8",
            "background-dark": "#101622",
            "surface-dark": "#1a2230",
            "surface-light": "#243047",
            "border-dark": "#232f48",
            "text-secondary": "#92a4c9",
          },
          fontFamily: {
            "display": ["Inter", "Noto Sans", "sans-serif"],
            "body": ["Inter", "Noto Sans", "sans-serif"]
          },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
          backgroundImage: {
            'gradient-primary': 'linear-gradient(135deg, #135bec 0%, #3b82f6 100%)',
            'gradient-surface': 'linear-gradient(180deg, rgba(35, 47, 72, 0.4) 0%, rgba(16, 22, 34, 0) 100%)',
          }
        },
      },
    }
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #101622;
    }

    ::-webkit-scrollbar-thumb {
      background: #232f48;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #324467;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #232f48;
      border-radius: 20px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: #3b4d6e;
    }

    .glass-panel {
      background: rgba(17, 23, 34, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Dark mode form input styles */
    .dark input,
    .dark select,
    .dark textarea {
      color: white;
      background-color: #243047;
    }

    .dark input::placeholder,
    .dark textarea::placeholder {
      color: #92a4c9;
    }

    .dark select option {
      background-color: #1a2230;
      color: white;
    }

    .dark input:focus,
    .dark select:focus,
    .dark textarea:focus {
      outline: none;
      border-color: #135bec;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
