<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/Enarxi logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPMS - Internal Project Management System</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#002045", 
            "primary-hover": "#001a38",
            "accent": "#2d4263",
            "accent-hover": "#1f2f47",
            "background-light": "#ECF1FF",
            "background-dark": "#ECF1FF", 
            "surface-dark": "#ffffff",
            "surface-light": "#ffffff",
            "text-secondary": "#002045", 
            "text-primary": "#002045",
            "panel-dark": "#ffffff",
            "midnight": "#ECF1FF"
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"],
            "mono": ["Geist Mono", "monospace"],
            "display": ["Inter", "sans-serif"],
            "body": ["Inter", "sans-serif"]
          },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
          backgroundImage: {
            'gradient-primary': 'linear-gradient(135deg, #002045 0%, #001a38 100%)', 
            'gradient-surface': 'linear-gradient(180deg, rgba(0, 32, 69, 0.1) 0%, rgba(255, 255, 255, 0) 100%)',
          }
        },
      },
    }
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #101622;
    }

    ::-webkit-scrollbar-thumb {
      background: #232f48;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #324467;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #2d313d;
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #3f4455;
    }

    .glass-border {
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hero-gradient {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(10, 12, 18, 0) 100%);
    }

    .glass-panel {
      background: rgba(17, 23, 34, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Dark mode form input styles */
    .dark input,
    .dark select,
    .dark textarea {
      color: white;
      background-color: #243047;
    }

    .dark input::placeholder,
    .dark textarea::placeholder {
      color: #92a4c9;
    }

    .dark select option {
      background-color: #1a2230;
      color: white;
    }

    .dark input:focus,
    .dark select:focus,
    .dark textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
